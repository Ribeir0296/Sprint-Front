<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Turma do Bem</title>

  <!-- Ícone da aba do navegador (favicon) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='none' stroke='%23E8A56F' stroke-width='6' stroke-linecap='round'%3E%3Ccircle cx='50' cy='50' r='17'/%3E%3Cpath d='M50 8v17 M50 75v17 M8 50h17 M75 50h17 M20.3 20.3l12 12 M67.7 67.7l12 12 M79.7 20.3l-12 12 M32.3 67.7l-12 12'/%3E%3C/g%3E%3C/svg%3E">

  <!-- Fontes utilizadas no projeto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&family=Roboto:wght@600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style_cadastro_atualizado.css">
</head>

<body>
  <div class="pagina">
    <main>
      <!-- Área de cadastro -->
      <section class="formulario">
        <svg class="logo" viewBox="0 0 100 100" fill="none"
          stroke="currentColor" stroke-width="3.6" stroke-linecap="round"
          role="img" aria-label="Símbolo da Turma do Bem">
          <circle cx="50" cy="50" r="14"/>
          <g>
            <line x1="50" y1="4" x2="50" y2="20"/>
            <line x1="50" y1="4" x2="50" y2="20" transform="rotate(45 50 50)"/>
            <line x1="50" y1="4" x2="50" y2="20" transform="rotate(90 50 50)"/>
            <line x1="50" y1="4" x2="50" y2="20" transform="rotate(135 50 50)"/>
            <line x1="50" y1="4" x2="50" y2="20" transform="rotate(180 50 50)"/>
            <line x1="50" y1="4" x2="50" y2="20" transform="rotate(225 50 50)"/>
            <line x1="50" y1="4" x2="50" y2="20" transform="rotate(270 50 50)"/>
            <line x1="50" y1="4" x2="50" y2="20" transform="rotate(315 50 50)"/>
          </g>
        </svg>

        <h1>Crie sua conta</h1>
        <p class="subtitulo">Preencha os dados abaixo para se cadastrar na plataforma.</p>

        <form class="campos" id="cadastro" novalidate>
          <input id="nome" type="text" placeholder="Nome Completo"
            aria-label="Nome completo" autocomplete="name">
          <input id="email" type="email" placeholder="Email"
            aria-label="Email" autocomplete="email">
          <input id="senha" type="password" placeholder="Crie uma Senha"
            aria-label="Crie uma senha" autocomplete="new-password">

          <button class="botao" type="submit">Finalizar Cadastro</button>

          <div class="ou"><span></span>ou<span></span></div>
          <a class="botao-secundario" href="#">Já tenho uma conta</a>
        </form>

        <p class="termos">
          Ao se cadastrar, você concorda com <a href="#">nossos termos</a>.
        </p>
      </section>

      <!-- Área de apresentação dos serviços -->
      <section class="vitrine">
        <div class="brilho" aria-hidden="true"></div>

        <svg class="sol-fundo" aria-hidden="true" viewBox="0 0 100 100"
          fill="none" stroke="#E8A56F" stroke-width="1.6"
          stroke-linecap="round">
          <circle cx="50" cy="50" r="14"/>
          <g>
            <line x1="50" y1="4" x2="50" y2="20"/>
            <line x1="50" y1="4" x2="50" y2="20" transform="rotate(45 50 50)"/>
            <line x1="50" y1="4" x2="50" y2="20" transform="rotate(90 50 50)"/>
            <line x1="50" y1="4" x2="50" y2="20" transform="rotate(135 50 50)"/>
            <line x1="50" y1="4" x2="50" y2="20" transform="rotate(180 50 50)"/>
            <line x1="50" y1="4" x2="50" y2="20" transform="rotate(225 50 50)"/>
            <line x1="50" y1="4" x2="50" y2="20" transform="rotate(270 50 50)"/>
            <line x1="50" y1="4" x2="50" y2="20" transform="rotate(315 50 50)"/>
          </g>
        </svg>

        <div class="chamada">
          <span class="selo">Turma do Bem</span>
          <h2>Cuidar do sorriso é cuidar da <span>pessoa inteira.</span></h2>
        </div>

        <div class="arcos">
          <!-- Serviço 1: Odontologia -->
          <figure class="servico">
            <div class="arco laranja" style="height: 350px;">
              <svg viewBox="0 0 100 100" fill="none" stroke="currentColor"
                stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <path d="M30 14C18 12 10 22 14 38C17 50 20 58 22 74C23 84 30 88 33 76C35 68 38 62 50 62C62 62 65 68 67 76C70 88 77 84 78 74C80 58 83 50 86 38C90 22 82 12 70 14C62 16 56 20 50 20C44 20 38 16 30 14Z"/>
              </svg>
            </div>
            <figcaption>
              <strong class="texto-laranja">Odontologia</strong>
              <span>Cuidado com o sorriso</span>
            </figcaption>
          </figure>

          <!-- Serviço 2: Psicologia -->
          <figure class="servico">
            <div class="arco areia" style="height: 310px;">
              <svg viewBox="0 0 100 100" fill="none" stroke="currentColor"
                stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <path d="M20 14C20 46 30 62 50 62C70 62 80 46 80 14"/>
                <line x1="50" y1="8" x2="50" y2="92"/>
              </svg>
            </div>
            <figcaption>
              <strong class="texto-areia">Psicologia</strong>
              <span>Cuidado com a mente</span>
            </figcaption>
          </figure>

          <!-- Serviço 3: Acolhimento -->
          <figure class="servico">
            <div class="arco claro" style="height: 320px;">
              <svg viewBox="0 0 100 100" fill="none" stroke="currentColor"
                stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <path d="M50 88C18 64 10 46 10 33C10 20 20 11 32 11C40 11 46 16 50 23C54 16 60 11 68 11C80 11 90 20 90 33C90 46 82 64 50 88Z"/>
                <g transform="translate(25 19) scale(.5)" stroke-width="10">
                  <circle cx="50" cy="36" r="22"/>
                  <line x1="50" y1="58" x2="50" y2="90"/>
                  <line x1="35" y1="75" x2="65" y2="75"/>
                </g>
              </svg>
            </div>
            <figcaption>
              <strong class="texto-laranja">Acolhimento</strong>
              <span>Cuidado com você</span>
            </figcaption>
          </figure>

          <!-- Serviço 4: Atendimento gratuito -->
          <figure class="servico">
            <div class="arco areia" style="height: 310px;">
              <svg viewBox="0 0 100 100" fill="none" stroke="currentColor"
                stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <defs>
                  <mask id="corte">
                    <rect width="100" height="100" fill="#fff"/>
                    <line x1="14" y1="14" x2="86" y2="86"
                      stroke="#000" stroke-width="15"/>
                  </mask>
                </defs>
                <g mask="url(#corte)">
                  <path d="M39 31C24 40 15 55 16 69C17 82 28 89 50 89C72 89 83 82 84 69C85 55 76 40 61 31Z"/>
                  <path d="M39 31L33 15C43 19 57 19 67 15L61 31"/>
                  <path d="M57 53C55 50.5 52.5 49.5 50 49.5C45.5 49.5 43 52 43 55.5C43 63 57 59.5 57 67.5C57 71 54.5 74 50 74C46.5 74 44 72.5 42.5 70" stroke-width="4.5"/>
                  <line x1="50" y1="44" x2="50" y2="79" stroke-width="4.5"/>
                </g>
                <line x1="14" y1="14" x2="86" y2="86"/>
              </svg>
            </div>
            <figcaption>
              <strong class="texto-areia">Sem custos</strong>
              <span>Atendimento gratuito</span>
            </figcaption>
          </figure>

          <!-- Serviço 5: Doação e colaboração -->
          <figure class="servico">
            <div class="arco laranja" style="height: 335px;">
              <svg viewBox="0 0 100 100" fill="none" stroke="currentColor"
                stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <path d="M56 46C43 37 37 31 37 24C37 18.5 41 15 45.5 15C49.5 15 52.5 17 56 21C59.5 17 62.5 15 66.5 15C71 15 75 18.5 75 24C75 31 69 37 56 46Z"/>
                <rect x="7" y="60" width="13" height="30" rx="3"/>
                <path d="M20 65H37C43 65 47 67 51 71H62C67 71 67 79 62 79H47"/>
                <path d="M20 86H55C59 86 62 85 65 83.5L86 71.5C91.5 68.5 88.5 60.5 82 63.5L64.5 72.5"/>
              </svg>
            </div>
            <figcaption>
              <strong class="texto-laranja">Faça o bem</strong>
              <span>Seja doador ou colaborador</span>
            </figcaption>
          </figure>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Seleciona o formulário de cadastro na página.
    const formulario = document.getElementById("cadastro");

    // Impede que o formulário recarregue a página ao ser enviado.
    formulario.addEventListener("submit", function(evento) {
      evento.preventDefault();
    });
  </script>
</body>
</html>
